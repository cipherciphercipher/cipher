# Cipher server: Cloudflare Worker configuration. See server/README.md for setup.
name = "cipher-server"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Served at <name>.<your subdomain>.workers.dev only; no per-version preview addresses.
workers_dev = true
preview_urls = false

# Nothing about requests is logged or kept.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "cipher"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Messages are kept in D1 above (works on the free plan, no card). To keep them in R2
# instead (no D1 backups of deleted messages; R2 needs a payment method), create the
# bucket and its lifecycle rules (see README) and uncomment:
# [[r2_buckets]]
# binding = "MESSAGES"
# bucket_name = "cipher-messages"

# Per-IP request limit (Workers rate limiting). Adjust to taste.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Hourly cleanup: expired messages, due key resets, old usage counters.
[triggers]
crons = ["17 * * * *"]

[vars]
PUBLIC_URL = "https://REPLACE_WITH_YOUR_WORKER_URL"
DISCORD_CLIENT_ID = "REPLACE_WITH_YOUR_DISCORD_APPLICATION_ID"
# Uploads per month before the server stops accepting new ones (bill cap).
# 900000 stays inside R2's free 1 million writes a month; raise it on a paid plan.
MONTHLY_UPLOAD_LIMIT = "900000"
USER_DAILY_UPLOADS = "300"
# D1 message storage cap in MB (a free D1 database holds 500 MB, shared with the key directory).
MAX_STORED_MB = "400"
MIN_ACCOUNT_AGE_DAYS = "2"

# Secrets, set with `npx wrangler secret put NAME` (never put them in this file):
#   SECRET                 a long random string (at least 32 characters)
#   DISCORD_CLIENT_SECRET  from the Discord developer portal
